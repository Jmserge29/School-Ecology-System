<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nueva contraseña · EcoEscuela</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles/tokens.css">
  <link rel="stylesheet" href="src/styles/base.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <link rel="stylesheet" href="src/styles/layout.css">
  <link rel="stylesheet" href="src/styles/pages/auth.css">
</head>
<body>
  <div class="auth">
    <aside class="auth__aside">
      <div class="auth__deco" aria-hidden="true"></div>
      <a class="brand" href="index.html" id="brand"></a>
      <div>
        <h1 class="auth__headline">Un nuevo comienzo.</h1>
        <p class="auth__lead">Crea una contraseña segura para seguir registrando el impacto ambiental de tu colegio.</p>
      </div>
      <div></div>
    </aside>
    <main class="auth__main">
      <div class="auth__card">
        <div id="msg-alert" hidden class="alert"></div>
        <div id="waiting" class="loader"><span class="spinner"></span>Verificando enlace…</div>
        <section id="view-form" hidden>
          <div>
            <h2 class="auth__title">Crea tu nueva contraseña</h2>
            <p class="auth__subtitle">Mínimo 8 caracteres.</p>
          </div>
          <form class="auth__form" id="form-reset" novalidate style="margin-top:22px">
            <div class="field" data-field="password">
              <label class="field__label" for="password">Nueva contraseña</label>
              <input class="input" id="password" name="password" type="password" autocomplete="new-password" required>
              <span class="field__error"></span>
            </div>
            <div class="field" data-field="confirmar">
              <label class="field__label" for="confirmar">Confirmar contraseña</label>
              <input class="input" id="confirmar" name="confirmar" type="password" autocomplete="new-password" required>
              <span class="field__error"></span>
            </div>
            <button class="btn btn--primary btn--block" type="submit">Guardar contraseña</button>
          </form>
        </section>
        <p class="auth__foot"><a class="auth__link" href="login.html">← Volver a iniciar sesión</a></p>
      </div>
    </main>
  </div>
  <script type="module" src="src/pages/reset-password.js"></script>
</body>
</html>
